name: Send reminders

on:
  schedule:
    # GitHub cron runs late or drops on busy minutes (:00/:30), so fire
    # slightly early on odd minutes, with a backup ~40 min later. The
    # script's time-window check + notification tag dedupe handle overlap.
    # Morning ~6:00am Ho Chi Minh (ICT = UTC+7, no DST)
    - cron: '37 22 * * *'
    - cron: '17 23 * * *'
    # Evening ~8:30pm Ho Chi Minh
    - cron: '7 13 * * *'
    - cron: '47 13 * * *'
  workflow_dispatch:
    inputs:
      test:
        description: Send a test notification regardless of time
        default: 'no'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install web-push --no-save
      - run: node send-push.mjs
        env:
          VAPID_PUBLIC_KEY: BJLNly7ZfSvzLNnkCIRa3AFqnOpB8OtMoJBH24r2RibAfqes38vCCZPAQth4FJv7lSSYmOob_8J385WWLS1mivQ
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FORCE_TEST: ${{ inputs.test || 'no' }}
