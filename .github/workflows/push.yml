name: Send reminders

on:
  schedule:
    # GitHub cron is late/droppy, so primaries start ~50 min EARLY on quiet
    # minutes and the script sleeps until the exact send time. Fallbacks run
    # after the target and only send if the primary never showed up.
    # Morning 6:00am Ho Chi Minh (= 23:00 UTC prev day)
    - cron: '10 22 * * *'
    - cron: '25 23 * * *'
    # Evening 8:30pm Ho Chi Minh (= 13:30 UTC)
    - cron: '40 12 * * *'
    - cron: '55 13 * * *'
  workflow_dispatch:
    inputs:
      test:
        description: Send a test notification immediately
        default: 'no'

permissions:
  actions: read
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install web-push --no-save
      - run: node send-push.mjs
        env:
          VAPID_PUBLIC_KEY: BJLNly7ZfSvzLNnkCIRa3AFqnOpB8OtMoJBH24r2RibAfqes38vCCZPAQth4FJv7lSSYmOob_8J385WWLS1mivQ
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FORCE_TEST: ${{ inputs.test || 'no' }}
          GH_TOKEN: ${{ github.token }}
