name: Send reminders

on:
  schedule:
    # Ho Chi Minh 6:00am — 23:00 UTC previous day (ICT is UTC+7, no DST)
    - cron: '0 23 * * *'
    # Ho Chi Minh 8:30pm — 13:30 UTC
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      test:
        description: Send a test notification regardless of time
        default: 'no'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install web-push --no-save
      - run: node send-push.mjs
        env:
          VAPID_PUBLIC_KEY: BJLNly7ZfSvzLNnkCIRa3AFqnOpB8OtMoJBH24r2RibAfqes38vCCZPAQth4FJv7lSSYmOob_8J385WWLS1mivQ
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FORCE_TEST: ${{ inputs.test || 'no' }}
